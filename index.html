<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">TEMA</span>
          <label class="theme-switch">
            <span>🌙</span>
            <input type="checkbox" id="theme-toggle" aria-label="Cambiar entre tema oscuro y claro" />
            <span class="track"></span>
            <span>☀️</span>
          </label>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="overlay-box pause-box">
        <p id="pause-title">PAUSA</p>
        <button type="button" class="pause-item" id="pause-resume">Reanudar</button>
        <button type="button" class="pause-item" id="pause-restart">Reiniciar</button>
        <button type="button" class="pause-item" id="pause-controls-btn" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
        <ul id="pause-controls" class="pause-controls hidden">
          <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
          <li><span><kbd>↑</kbd> o <kbd>X</kbd></span> rotar</li>
          <li><span><kbd>↓</kbd></span> bajar</li>
          <li><span><kbd>Space</kbd></span> caída</li>
          <li><span><kbd>P</kbd> / <kbd>Esc</kbd></span> pausa</li>
        </ul>
        <div class="pause-item pause-level" id="pause-level" tabindex="0" role="spinbutton"
             aria-label="Nivel inicial" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1">
          <button type="button" class="level-step" data-step="-1" tabindex="-1" aria-label="Bajar nivel inicial">◀</button>
          <span>Nivel inicial: <b id="pause-level-value">1</b></span>
          <button type="button" class="level-step" data-step="1" tabindex="-1" aria-label="Subir nivel inicial">▶</button>
        </div>
        <p class="pause-hint">Se aplica a la próxima partida<br><kbd>↑</kbd><kbd>↓</kbd> navegar · <kbd>Enter</kbd> elegir · <kbd>←</kbd><kbd>→</kbd> nivel</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
